[build]
command = "cd backend && npm ci && npm run migrate && npm run bootstrap:initial"
publish = "netlify-public"
functions = "backend/netlify/functions"

[build.environment]
NODE_VERSION = "22"

[functions]
node_bundler = "esbuild"
included_files = ["frontend/admin/**/*", "frontend/assets/**/*"]

[[redirects]]
from = "/"
to = "/.netlify/functions/api/"
status = 200
force = true

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true
