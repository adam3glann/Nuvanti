<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Settings — Nuvanti Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
  </head>
  <body>
    <div class="admin-shell" id="adminShell">
      <div id="admin-sidebar-mount"></div>
      <div class="admin-main">
        <div id="admin-header-mount"></div>
        <div class="admin-content" id="settingsRoot">
          <div class="page-title-row">
            <div>
              <h1>Settings</h1>
              <p>Store configuration and preferences.</p>
            </div>
          </div>
          <div
            class="admin-tabs"
            id="tabs"
            style="
              border-bottom: 1px solid var(--a-border);
              margin-bottom: 1.25rem;
              padding-inline: 0;
            "
          ></div>
          <div id="settingsPanel"></div>
        </div>
      </div>
    </div>
    <script type="module" src="assets/js/pages/settings.js"></script>
  </body>
</html>
