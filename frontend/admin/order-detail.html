<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=4" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=4"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Order — Nuvanti Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
  </head>
  <body>
    <div class="admin-shell" id="adminShell">
      <div id="admin-sidebar-mount"></div>
      <div class="admin-main">
        <div id="admin-header-mount"></div>
        <div class="admin-content">
          <div class="page-title-row">
            <div><h1 id="pageHeading">Order</h1></div>
            <a href="orders.html" class="btn btn-outline btn-sm"
              >← Back to Orders</a
            >
          </div>
          <div id="orderRoot"></div>
        </div>
      </div>
    </div>
    <style>
      @media (max-width: 1100px) {
        .od-grid {
          grid-template-columns: 1fr !important;
        }
      }
      .order-address-row {
        display: grid;
        grid-template-columns: minmax(7rem, 0.7fr) minmax(0, 1.3fr);
        gap: 0.75rem;
        padding-block: 0.25rem;
      }
      .order-address-row > span {
        color: var(--a-muted);
      }
      .order-address-row > strong {
        min-width: 0;
        overflow-wrap: anywhere;
        text-align: right;
      }
      @media (max-width: 540px) {
        .order-address-row {
          grid-template-columns: minmax(6rem, 0.8fr) minmax(0, 1.2fr);
          gap: 0.5rem;
        }
      }
    </style>
    <script
      type="module"
      src="assets/js/pages/orderDetail.js?v=delivery-address-details-2"
    ></script>
  </body>
</html>
