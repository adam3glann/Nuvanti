<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Inventory — Nuvanti Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
</head>
<body>
<div class="admin-shell" id="adminShell">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-main">
    <div id="admin-header-mount"></div>
    <div class="admin-content">
      <div class="page-title-row">
        <div><h1>Inventory</h1><p>Track and adjust stock across every product variant.</p></div>
        <button class="btn btn-outline" id="exportBtn">Export CSV</button>
      </div>
      <div class="stat-grid" id="statGrid"></div>
      <div class="card">
        <div class="filter-bar">
          <input type="search" id="searchInput" placeholder="Search by product or SKU…" style="min-width:220px" />
          <select id="statusFilter">
            <option value="">All Statuses</option>
            <option value="in">In Stock</option>
            <option value="low">Low Stock</option>
            <option value="out">Out of Stock</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>Product</th><th>Size</th><th>SKU</th><th>Stock</th><th>Reserved</th><th>Available</th><th>Status</th><th></th></tr></thead>
            <tbody id="invBody"></tbody>
          </table>
        </div>
        <div id="paginationWrap"></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="assets/js/pages/inventory.js"></script>
</body>
</html>
