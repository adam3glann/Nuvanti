<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin Login — Nuvanti</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
</head>
<body>
<div class="admin-login-shell">
  <div class="admin-login-card">
    <div class="admin-login-mark">
      <div class="admin-sidebar__mark" style="background:var(--a-primary)">N</div>
      <div>
        <h1 class="h1" style="font-size:1.2rem">Nuvanti Admin Portal</h1>
        <p style="color:var(--a-muted);font-size:.8rem;margin-top:.25rem">Sign in to manage your store.</p>
      </div>
    </div>

    <div class="form-error" id="loginError" hidden></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" required autocomplete="current-password" style="padding-right:3.2rem" />
          <button type="button" class="password-toggle" id="togglePassword">Show</button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
        <label class="checkbox-row"><input type="checkbox" id="rememberDevice" /> Remember this device</label>
        <button type="button" id="forgotPassword" class="btn-ghost" style="font-size:.78rem;font-weight:600;color:var(--a-primary)">Forgot password?</button>
      </div>
      <button class="btn btn-primary" type="submit" id="loginSubmit" style="width:100%">Sign In</button>
    </form>

    <div class="security-note">
      <span>This portal is for authorized Nuvanti staff only. All access attempts are logged and monitored.</span>
    </div>

    <p id="passwordHelp" class="security-note" hidden></p>
  </div>
</div>
<script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
