<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Audit Logs — Nuvanti Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
</head>
<body>
<div class="admin-shell" id="adminShell">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-main">
    <div id="admin-header-mount"></div>
    <div class="admin-content" id="auditRoot">
      <div class="page-title-row"><div><h1>Audit Logs</h1><p>A record of sensitive actions taken across the dashboard. The backend generates and stores the authoritative log — this view only displays it.</p></div></div>
      <div class="card">
        <div class="filter-bar">
          <input type="search" id="searchInput" placeholder="Search action or resource…" style="min-width:220px" />
          <select id="userFilter"></select>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>Admin</th><th>Action</th><th>Resource</th><th>Timestamp</th><th>IP</th></tr></thead>
            <tbody id="auditBody"></tbody>
          </table>
        </div>
        <div id="paginationWrap"></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="assets/js/pages/auditLogs.js"></script>
</body>
</html>
