<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Orders — Nuvanti Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
</head>
<body>
<div class="admin-shell" id="adminShell">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-main">
    <div id="admin-header-mount"></div>
    <div class="admin-content">
      <div class="page-title-row"><div><h1>Orders</h1><p>Every order placed on Nuvanti, in one place.</p></div></div>
      <div class="card">
        <div class="filter-bar">
          <input type="search" id="searchInput" placeholder="Search order #, name, or email…" style="min-width:220px" />
          <select id="statusFilter">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option><option value="processing">Processing</option>
            <option value="shipped">Shipped</option><option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option><option value="returned">Returned</option>
          </select>
          <select id="paymentFilter">
            <option value="">All Payments</option>
            <option value="paid">Paid</option><option value="pending">Payment Pending</option>
            <option value="refunded">Refunded</option><option value="failed">Failed</option>
          </select>
          <select id="sortSelect" style="margin-left:auto">
            <option value="newest">Newest</option><option value="oldest">Oldest</option>
            <option value="total-desc">Highest Value</option><option value="total-asc">Lowest Value</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
        <div id="paginationWrap"></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="assets/js/pages/orders.js"></script>
</body>
</html>
