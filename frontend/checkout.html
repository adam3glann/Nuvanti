<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Nuvanti</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container">
    <div class="page-hero" style="border:none;padding-bottom:0"><h1>Checkout</h1></div>
    <div class="steps">
      <span class="step" data-done="true"><span class="step-num">1</span> Bag</span>
      <span class="step" data-active="true"><span class="step-num">2</span> Checkout</span>
      <span class="step"><span class="step-num">3</span> Confirmation</span>
    </div>
    <div class="checkout-layout">
      <form id="checkoutForm" novalidate></form>
      <div class="order-summary-mini" id="checkoutSummary"></div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/pages/checkout.js"></script>
</body>
</html>
