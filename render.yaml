# Deploy the PostgreSQL-backed API and protected admin gateway on one Render
# web service. Use this free plan for preview only; see DEPLOYMENT-POSTGRES.md.
services:
  - type: web
    name: nuvanti-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run migrate && npm run bootstrap:initial && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NUVANTI_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: NUVANTI_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: NUVANTI_BOOTSTRAP_ADMIN_NAME
        value: Nuvanti Owner
      - key: STORE_ORIGIN
        value: https://nuvanti.com
      - key: STORE_PREVIEW_ORIGIN
        value: https://nuvanti-shop.pages.dev
      - key: ADMIN_ORIGIN
        value: https://admin.nuvanti.com
      - key: ADMIN_APP_URL
        value: https://admin.nuvanti.com
      - key: API_PUBLIC_URL
        value: https://api.nuvanti.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
